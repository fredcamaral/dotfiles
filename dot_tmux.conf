# Fred's tmux config — stealth substrate for shells and coding agents
# Prefix: Ctrl-a

# Core
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",*:extkeys"
set -s escape-time 10
set -g history-limit 100000
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
# Quit an agent launched from a plain terminal → detach back to the shell.
set -g detach-on-destroy on
setw -g synchronize-panes off

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Modes
setw -g mode-keys vi
set -g status-keys vi

# Dracula palette: quiet chrome, high-signal status
set -g status on
set -g pane-border-status off
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9'
set -g pane-scrollbars off
set -g display-time 1000
set -g message-style 'bg=#44475a,fg=#f8f8f2'
set -g message-command-style 'bg=#44475a,fg=#f8f8f2'
set -g mode-style 'bg=#44475a,fg=#f8f8f2'
set -g popup-style 'bg=#282a36,fg=#f8f8f2'
set -g popup-border-style 'fg=#bd93f9,bg=#282a36'
set -g clock-mode-colour '#bd93f9'
set -g display-panes-colour '#6272a4'
set -g display-panes-active-colour '#50fa7b'
set -g visual-activity off
# Attention signal: agents emit BEL on finish/needs-input — the tab flags
# orange naming the agent that wants you. visual-bell stays off so the BEL
# also passes through to the client terminal.
set -g visual-bell off
set -g bell-action any
setw -g monitor-bell on
# Nothing legitimate renames windows via \ek escapes anymore — agent windows
# pin their names, and windows born from ail's break-pane must not drift.
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#T'

# Tab bar on top: the window list IS the agent index — ' #I·#W ' colored per
# agent prefix, same dracula palette as ail's pane borders: cc orange · oc
# green · cx cyan · dr pink · pi yellow; dN decks and plain windows dim.
# Bell-flagged tabs skip the fg chain (empty true branch): the chain's fg
# would override window-status-bell-style's dark fg — orange on orange.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#282a36,fg=#f8f8f2'
set -g status-left '#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#6272a4] #{?@ai_mode,#{@ai_mode}-up ,}'
set -g status-left-length 32
# ##{@ai_agent} keeps the format expander off the filter — /bin/sh must hand
# list-panes a literal #{@ai_agent} to evaluate per pane.
set -g status-right '#[bg=#282a36,fg=#50fa7b]#(tmux list-panes -s -t =isengard -f "##{@ai_agent}" 2>/dev/null | grep -c .) agents '
set -g status-right-length 16
set -g window-status-format '#{?window_bell_flag,,#{?#{m:cc*,#{window_name}},#[fg=#ffb86c],#{?#{m:oc*,#{window_name}},#[fg=#50fa7b],#{?#{m:cx*,#{window_name}},#[fg=#8be9fd],#{?#{m:dr*,#{window_name}},#[fg=#ff79c6],#{?#{m:pi*,#{window_name}},#[fg=#f1fa8c],#[fg=#6272a4]}}}}}} #I·#W '
set -g window-status-current-format '#[bg=#bd93f9,fg=#282a36,bold] #I·#W '
set -g window-status-separator ''
set -g window-status-bell-style 'bg=#ffb86c,fg=#282a36,bold'
# Activity is noise with a visible window list — agent TUI redraws would keep
# every tab permanently flagged. Bell is the signal.
setw -g monitor-activity off

# Windows and panes start in current path
bind c new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Navigation
unbind -nq M-[
unbind -nq M-]
# Up/Down open the native session/agent picker (Up/Down to move, Enter to
# choose). Runs inside tmux, not a popup, so it dodges the crossterm crash class.
bind -n M-Up    choose-tree -ZsN
bind -n M-Down  choose-tree -ZsN
# Left/Right hop panes — column hop, the primary gesture in mode 8
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-q previous-window
bind -n M-w next-window
# Aliases for pre-isengard muscle memory (Ghostty-era Alt+p/o tab hop).
bind -n M-p previous-window
bind -n M-o next-window
# Zoom one agent to full size (toggle), rename the current tab
bind -n M-z resize-pane -Z
bind -n M-r command-prompt -I '#W' 'rename-window -- "%%"'
# ail layout modes — absolute path: run-shell inherits the tmux server's PATH
# (may lack ~/.local/bin); single quotes defer $HOME expansion to /bin/sh.
# stdout silenced: run-shell renders output as a view-mode overlay on the
# focused pane — ail's display-message flash is the feedback, stderr the errors.
bind -n M-1 run-shell '$HOME/.local/bin/ail 1 >/dev/null'
bind -n M-2 run-shell '$HOME/.local/bin/ail 2 >/dev/null'
bind -n M-3 run-shell '$HOME/.local/bin/ail 3 >/dev/null'
bind -n M-4 run-shell '$HOME/.local/bin/ail 4 >/dev/null'
bind -n M-5 run-shell '$HOME/.local/bin/ail 5 >/dev/null'
bind -n M-6 run-shell '$HOME/.local/bin/ail 6 >/dev/null'
bind -n M-7 run-shell '$HOME/.local/bin/ail 7 >/dev/null'
bind -n M-8 run-shell '$HOME/.local/bin/ail 8 >/dev/null'
bind -n M-9 run-shell '$HOME/.local/bin/ail 9 >/dev/null'
# Deck self-repair: any pane death re-runs the declared mode. ail --repack is
# a silent no-op when @ai_mode is unset, so plain servers are unaffected.
# kill-pane does NOT emit pane-exited (tmux 3.7b) — after-kill-pane covers
# explicit kills (ai-kill, ais ^k). Idempotence is the loop guard: a repack
# that changes nothing fires no further work.
set-hook -g pane-exited 'run-shell "$HOME/.local/bin/ail --repack >/dev/null"'
set-hook -g after-kill-pane 'run-shell "$HOME/.local/bin/ail --repack >/dev/null"'
# Spawn picker: agent → repo → born straight into the deck (ail auto-pack).
bind -n M-n display-popup -E -w 60% -h 60% "zsh -ic ai-new"
# ais-style picker for ALL sessions (agents + plain); native choose-tree stays on prefix+s
bind -n M-s display-popup -E -w 94% -h 88% "zsh -ic 'ai-status --all'"
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1
# Prefix+arrows move between panes — Caps chords inject prefix+arrow via
# Karabiner (Ghostty-only), so Caps held + arrows = 4-way pane movement.
# Resize lives on Shift+arrows (Ghostty unbinds shift+up/down to pass them).
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5
bind Tab last-pane

# Mouse and copy mode
set -g mouse on
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"

# Quick overlays (no prefix): scratch shell, file manager, git
bind -n M-Enter display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -e TMUX_POPUP=1
# Plain yazi: the 3.6x popup crash (tmux/tmux#4942) is fixed in 3.7 — the
# nested-session workaround is reverted.
bind -n M-y display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "yazi"
bind -n M-g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"

# Utility bindings
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind . command-prompt -p "pane name:" "select-pane -T '%%'"
bind B setw synchronize-panes \; display-message "pane sync: #{?synchronize-panes,on,off}"
bind C-c command-prompt -p "new session:" "new-session -d -s '%%' -c '#{pane_current_path}'"
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind G display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind a display-popup -E -w 94% -h 88% "zsh -ic ai-status"
bind S set -g status \; display-message "tmux status: #{?status,on,off}"
bind P set -g pane-border-status \; display-message "pane titles: #{pane-border-status}"

# FZF integrations
bind f run-shell "~/.tmux/plugins/tmux-fzf/main.sh"
set -g @tmux-fzf-order 'session|window|pane|command'
set -g @tmux-fzf-pane-format '[#{pane_index}] #{pane_current_command} - #{pane_current_path}'
set -g @fzf-url-bind 'u'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-open'

# Resurrect/continuum: keep manual save available, avoid surprise resurrection
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "~yarn dev" "~npm start" "~rails server"'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @continuum-status 'off'

# Clipboard
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-no-clear'

# Minimal help popup
bind ? display-popup -E -w 56% -h 58% -T " tmux " "printf '%s\n' \
'Prefix: Ctrl-a' \
'' \
'Display toggles' \
'  S              toggle status bar' \
'  P              toggle pane titles' \
'' \
'Navigation' \
'  Alt+L/R        pane hop (columns)' \
'  Alt+z          zoom agent (toggle)' \
'  Alt+r          rename tab' \
'  Alt+1..9       layout modes (ail)' \
'  Alt+n          new agent (picker)' \
'  Alt+U/D        session tree' \
'  Shift+L/R      windows' \
'  Alt+q/w · p/o  previous/next tab' \
'  Alt+s          all sessions (ais style); ^k kills' \
'  a              agent sessions (ais)' \
'  s              native session tree; x kills' \
'' \
'Panes/windows' \
'  | / -          split' \
'  c / Alt+t      new tab' \
'  arrows         move panes (= Caps+arrows)' \
'  Shift+arrows   resize' \
'  Tab            last pane' \
'' \
'Copy' \
'  Escape/[       copy mode' \
'  v              select' \
'  y/Enter        copy to clipboard' \
'' \
'Overlays (no prefix)' \
'  Alt+Enter      popup shell' \
'  Alt+y          yazi' \
'  Alt+g          lazygit' \
'' \
'Utility' \
'  r              reload config' \
'  f              fzf picker' \
'  u              url picker' \
'  g/G            popup shell/lazygit' | less -R"

# TPM init. No auto-clone during startup; keep shell startup quiet.
if-shell '[ -d ~/.tmux/plugins/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm' 'display-message "TPM missing: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'
