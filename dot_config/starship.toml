"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface1)\
$username\
[](bg:surface0 fg:surface1)\
$directory\
[](bg:overlay0 fg:surface0)\
$git_branch\
$git_status\
[ ](fg:overlay0)\
$cmd_duration\
$fill\
$time\
$line_break
$character"""

palette = 'monochrome-light'

[os]
disabled = false
style = "bg:surface1 fg:text"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface1 fg:text"
style_root = "bg:surface1 fg:bright"
format = '[ $user ]($style)'

[hostname]
ssh_only = false
style = "bg:surface1 fg:text"
format = '[@$hostname]($style)'

[directory]
style = "bg:surface0 fg:text"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"repos" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:overlay0"
format = '[[ $symbol $branch ](fg:base bg:overlay0)]($style)'

[git_status]
style = "bg:overlay0"
format = '[[($all_status$ahead_behind )](fg:base bg:overlay0)]($style)'

[package]
disabled = false
symbol = "📦 "
style = "bg:surface2 fg:base"
format = '[[ $symbol$version ](bg:surface2 fg:base)]($style)'

[status]
disabled = false
format = '[[\[$status\] ](bg:bright fg:base)]($style)'
style = "bg:bright fg:base"

[jobs]
disabled = false
symbol = "✦ "
number_threshold = 1
format = '[[$symbol$number ](bg:surface2 fg:text)]($style)'
style = "bg:surface2 fg:text"

[nodejs]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[c]
symbol = " "
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[rust]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[golang]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[php]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[java]
symbol = " "
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[kotlin]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[haskell]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[python]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:text bg:surface2)]($style)'

[docker_context]
symbol = ""
style = "bg:surface1"
format = '[[ $symbol( $context) ](fg:text bg:surface1)]($style)'

[conda]
symbol = "  "
style = "fg:text bg:surface1"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:surface1"
format = ' [[ $time ](fg:text bg:surface1)]($style)'

[line_break]
disabled = false

[fill]
symbol = "·"
style = "bold dim"

[character]
disabled = false
success_symbol = '[  ❯](bold fg:text)'
error_symbol = '[  ❯](bold fg:bright)'
vimcmd_symbol = '[  ❮](bold fg:text)'
vimcmd_replace_one_symbol = '[  ❮](bold fg:dim)'
vimcmd_replace_symbol = '[  ❮](bold fg:dim)'
vimcmd_visual_symbol = '[  ❮](bold fg:overlay1)'

[cmd_duration]
show_milliseconds = false
format = " in $duration "
style = "fg:dim"
disabled = false
show_notifications = false
min_time_to_notify = 45000

[palettes.monochrome]
# Pure monochrome palette - black/grey/white spectrum (DARK MODE)
bright = "#ffffff"      # Pure white - for emphasis/errors
text = "#c0c0c0"        # Light grey - main text
dim = "#808080"         # Medium grey - secondary info
overlay1 = "#6a6a6a"    # Grey
overlay0 = "#555555"    # Darker grey
surface2 = "#444444"    # Dark grey
surface1 = "#333333"    # Darker
surface0 = "#262626"    # Very dark grey
base = "#1a1a1a"        # Near black - background

[palettes.monochrome-light]
# Inverted monochrome palette for LIGHT MODE terminals
# Note: 'base' stays dark because it's used as fg: for segment text
bright = "#c41a1a"      # Red-tinted dark - for errors (visible on light)
text = "#3a3a3a"        # Dark grey - main text (readable on light bg)
dim = "#707070"         # Medium grey - secondary info
overlay1 = "#909090"    # Light grey
overlay0 = "#b8b8b8"    # Light grey - git segment bg
surface2 = "#c8c8c8"    # Very light grey
surface1 = "#d8d8d8"    # Lightest segment bg
surface0 = "#e0e0e0"    # Near white - directory bg
base = "#2a2a2a"        # Dark - used as text inside segments (fg:base)
