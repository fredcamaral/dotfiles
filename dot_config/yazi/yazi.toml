[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "size"
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"
tab_size = 2
max_width = 1600
max_height = 1600
image_delay = 20
image_filter = "lanczos3"
image_quality = 85

[plugin]
prepend_fetchers = [
	# Git status badges
	{ url = "*",  run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
	# macOS Finder tags (no `id` needed on Yazi > v26.1.22)
	{ url = "*",  run = "mactag", group = "mactag" },
	{ url = "*/", run = "mactag", group = "mactag" },
	# Faster MIME detection by extension
	{ url = "local://*",  run = "mime-ext.local",  prio = "high", group = "mime" },
	{ url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },
]

prepend_previewers = [
	# Specific rules first; the generic dir/binary rules come last
	{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -s dark -w "$w" "$1"' },
	{ url = "*.svg", run = 'piper -- chafa -f symbols -s "${w}x${h}" "$1"' },
	{ url = "*.{csv,tsv}", run = 'piper -- bat -p --color=always "$1"' },
	{ url = "*.{db,sqlite,sqlite3}", run = 'piper -- sqlite3 "$1" .schema' },
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
	# Hex view only for unknown binaries — placed before the dir rule, never clobbers images
	{ mime = "application/octet-stream", run = 'piper -- hexyl --border=none "$1"' },
	{ url = "*/", run = "eza-preview" },
]

# Override only the `edit` opener -> micro. Openers merge by key, so the default
# open/play/extract/reveal openers stay intact. $EDITOR (nvim) is untouched, so
# git commits and the `E` keymap still use nvim.
[opener]
edit = [
	{ run = 'micro "$@"', desc = "micro", block = true, for = "unix" },
]
